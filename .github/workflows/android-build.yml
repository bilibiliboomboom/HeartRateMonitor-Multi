name: Android APK
on:
  push:
    branches:
      - main
      - feature/tablet-polar-team-ui
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build all debug variants
        run: gradle --no-daemon assembleDebug
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: HeartRateMonitor-Multi-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
